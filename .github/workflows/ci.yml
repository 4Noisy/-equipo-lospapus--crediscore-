name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# En PRs cancela ejecuciones viejas; en main NO, para no cortar un promote a medias
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Debe coincidir con la imagen de gitops: ghcr.io/4noisy/scoring-api
  IMAGE_NAME: scoring-api
  PYTHON_VERSION: "3.11"
  GITOPS_REPO: 4Noisy/gitops-repo

jobs:
  # ---------------------------------------------------------------------------
  # 1) QUALITY: lint, formato, tests, seguridad. Corre en PRs y en pushes.
  # ---------------------------------------------------------------------------
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formato (ruff format)
        run: ruff format --check .

      - name: Tests con cobertura
        run: |
          if [ -d tests ]; then
            python -m pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=70
          else
            echo "::warning::No existe carpeta tests/, se omiten los tests"
          fi

      - name: Análisis estático de seguridad (bandit)
        run: |
          if [ -d src ]; then bandit -r src -ll; else bandit -r . -ll --exclude ./tests,./.venv; fi

      - name: Auditoría de dependencias (pip-audit)
        run: |
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt; fi

      - name: Subir reporte de cobertura
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # 2) BUILD-AND-PUSH: construye UNA vez y publica ghcr.io/<owner>/scoring-api:<sha>
  # ---------------------------------------------------------------------------
  build-and-push:
    name: build-and-push
    needs: quality
    # push a main/develop o ejecución manual (para probar una rama); nunca en PRs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Calcular nombre de imagen (GHCR exige minúsculas)
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${OWNER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push (tag inmutable = SHA del commit)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Escaneo de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # 3) SIGN-AND-ATTEST (S10): firma la imagen y le adjunta su "certificado de origen".
  #    - Firma keyless: GitHub entrega un token OIDC y Sigstore emite un certificado
  #      de 10 minutos a nombre de ESTE workflow. No hay llave privada que cuidar.
  #    - Attestation SLSA: un JSON que dice qué repo, qué commit y qué workflow
  #      construyeron la imagen. También queda firmado y guardado junto a la imagen.
  #    - Al final verifica las dos cosas con cosign verify.
  # ---------------------------------------------------------------------------
  sign-and-attest:
    name: sign-and-attest
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # subir firma y attestation a GHCR
      id-token: write # pedir el token OIDC para la firma keyless
    env:
      # Siempre por digest: firmar un tag no sirve, el tag se puede mover
      IMAGE: ${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}
      # Quién debe aparecer en el certificado: este workflow en esta rama
      IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Firmar la imagen (Cosign keyless)
        run: cosign sign --yes "$IMAGE"

      - name: Crear la provenance SLSA (qué, quién y desde dónde se construyó)
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          jq -n \
            --arg builder "$IDENTITY" \
            --arg repo "git+${REPO_URL}@${GITHUB_REF}" \
            --arg sha "$GITHUB_SHA" \
            --arg run "$RUN_URL" \
            --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              builder: { id: $builder },
              buildType: "https://github.com/4Noisy/-equipo-lospapus--crediscore-/blob/main/docs/adr/0007-supply-chain.md",
              invocation: {
                configSource: { uri: $repo, digest: { sha1: $sha }, entryPoint: ".github/workflows/ci.yml" }
              },
              metadata: {
                buildInvocationId: $run,
                buildFinishedOn: $now,
                completeness: { parameters: true, environment: false, materials: true },
                reproducible: false
              },
              materials: [ { uri: $repo, digest: { sha1: $sha } } ]
            }' > provenance.json
          cat provenance.json

      - name: Adjuntar la attestation SLSA a la imagen
        run: cosign attest --yes --type slsaprovenance --predicate provenance.json "$IMAGE"

      - name: Verificar firma y attestation (cosign verify)
        run: |
          set -euo pipefail
          echo "== cosign verify =="
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE" \
            | jq '.[0].optional | {Subject, Issuer, githubWorkflowRef, githubWorkflowSha}'
          echo "== cosign verify-attestation (slsaprovenance) =="
          cosign verify-attestation --type slsaprovenance \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE" \
            | jq -r '.payload' | base64 -d | jq '{predicateType, builder: .predicate.builder.id, commit: .predicate.materials[0].digest.sha1}'

      - name: Resumen
        run: |
          {
            echo "### Firma y SLSA"
            echo "- Imagen: \`${IMAGE}\`"
            echo "- Firmada por: \`${IDENTITY}\`"
            echo "- \`cosign verify\` y \`cosign verify-attestation\`: OK"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 4) PROMOTE (GitOps): NO toca el clúster. Edita el repo gitops-repo:
  #    - dev  -> commit directo a main; Argo CD sincroniza solo.
  #    - prod -> Pull Request (requiere revisión humana antes de mergear).
  # ---------------------------------------------------------------------------
  promote:
    name: promote
    # Solo se promueve una imagen firmada y verificada
    needs: [build-and-push, sign-and-attest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: promote-gitops
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
      DIGEST: ${{ needs.build-and-push.outputs.digest }}
      TAG: ${{ github.sha }}
    steps:
      - name: Verificar secret GITOPS_TOKEN
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "::error::Falta el secret GITOPS_TOKEN (PAT con acceso a ${GITOPS_REPO})"
            exit 1
          fi

      - name: Checkout repo GitOps
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          fetch-depth: 0
          path: gitops

      - name: Dev - fijar tag y commitear a main (Argo CD despliega)
        working-directory: gitops
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          F=overlays/dev/kustomization.yaml
          grep -q "name: ${IMAGE}" "$F" || { echo "::error::${IMAGE} no aparece en $F"; exit 1; }

          # Entre comillas: un SHA solo con dígitos/"e" podría interpretarse como número
          sed -i -E "s|^(\s*newTag:)\s*[^ #]+|\1 \"${TAG}\"|" "$F"
          kubectl kustomize overlays/dev > /dev/null

          if git diff --quiet; then echo "dev ya estaba en ${TAG}"; exit 0; fi
          git commit -am "chore(dev): scoring-api -> ${TAG:0:7}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Prod - abrir/actualizar PR (2 revisores)
        working-directory: gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="promote/prod-scoring-api"
          git fetch origin main
          git checkout -B "$BRANCH" origin/main

          F=overlays/prod/kustomization.yaml
          grep -q "name: ${IMAGE}" "$F" || { echo "::error::${IMAGE} no aparece en $F"; exit 1; }
          sed -i -E "s|^(\s*newTag:)\s*[^ #]+|\1 \"${TAG}\"|" "$F"
          kubectl kustomize overlays/prod > /dev/null

          if git diff --quiet; then echo "prod ya estaba en ${TAG}"; exit 0; fi
          git commit -am "chore(prod): scoring-api -> ${TAG:0:7}"
          git push --force origin "$BRANCH"

          TITLE="Promover scoring-api ${TAG:0:7} a prod"
          BODY="Imagen: \`${IMAGE}:${TAG}\`
          Digest: \`${DIGEST}\`
          Commit origen: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${TAG}
          Pipeline: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Ya pasó quality, build, escaneo Trivy y quedó firmada (Cosign + SLSA). Requiere revisión antes de mergear."

          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          else
            gh pr edit "$BRANCH" --title "$TITLE" --body "$BODY"
          fi

      - name: Resumen
        run: |
          {
            echo "### Promoción GitOps"
            echo "- Imagen: \`${IMAGE}:${TAG}\`"
            echo "- dev: commit directo a main (Argo CD sincroniza)"
            echo "- prod: PR abierto/actualizado en ${GITOPS_REPO}"
          } >> "$GITHUB_STEP_SUMMARY"
