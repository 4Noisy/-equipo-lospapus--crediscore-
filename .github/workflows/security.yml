name: security

# S09 · DevSecOps I. Este archivo reúne los jobs de seguridad del equipo.
# Jobs: `sca` (Trivy + SBOM) y `secrets` (secret scanning con historial completo).
# El job `sast` se agrega debajo, en paralelo.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # lunes 09:00 UTC: re-escaneo semanal (reglas nuevas de gitleaks)
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.28.0"
  PYTHON_VERSION: "3.13" # misma versión que ci.yml y el Dockerfile
  CYCLONEDX_BOM_VERSION: "8.0.1"

jobs:
  sca:
    name: sca (Trivy + SBOM CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # El SBOM se genera desde el entorno ya instalado, no desde requirements.txt:
      # requirements.txt fija 3 dependencias directas, pero al instalarlas llegan ~15
      # (pydantic, anyio, h11...). Un CVE en una transitiva solo se ve en este SBOM.
      - name: Generar SBOM CycloneDX (directas + transitivas)
        run: |
          set -euo pipefail
          python -m venv /tmp/app
          /tmp/app/bin/pip install -q -r requirements.txt
          pip install -q "cyclonedx-bom==${CYCLONEDX_BOM_VERSION}"
          # cyclonedx-py valida el JSON contra el esquema CycloneDX y falla si no es válido.
          cyclonedx-py environment /tmp/app/bin/python --of JSON -o sbom.json

      - name: Subir SBOM como artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90 # máximo de GitHub

      # Gate 1: dependencias declaradas en el repo (requirements.txt y otros manifiestos).
      # Falla en HIGH/CRITICAL solo si ya existe versión con parche (ignore-unfixed).
      - name: Trivy filesystem (dependencias declaradas)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Gate 2: el SBOM completo, para cubrir las transitivas que requirements.txt no lista.
      - name: Trivy sobre el SBOM (incluye transitivas)
        if: always() && hashFiles('sbom.json') != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: sbom.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Resumen
        if: always() && hashFiles('sbom.json') != ''
        run: |
          {
            echo "### SCA (Trivy) + SBOM"
            echo "- SBOM CycloneDX: $(jq '.components | length' sbom.json) componentes (artefacto \`sbom-cyclonedx\`)"
            echo "- Gate: falla en HIGH/CRITICAL con parche disponible (\`ignore-unfixed\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: secrets (gitleaks, historial completo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 trae TODOS los commits y ramas. Sin esto el clon es
      # superficial (1 commit) y un secreto borrado después no se detectaría.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (versión fijada + checksum)
        run: |
          set -euo pipefail
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          TAR="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$TAR" "${BASE}/${TAR}"
          curl -sSfL -o checksums.txt "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c checksums.txt
          tar -xzf "$TAR" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Escanea el historial de todas las ramas (no solo el rango del PR).
      # Falla (exit 1) si hay hallazgos no justificados en .gitleaks.toml.
      - name: Escaneo del historial completo
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            --verbose

      - name: Subir reporte (SARIF)
        if: always() && hashFiles('gitleaks-report.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 30

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Secret scanning (gitleaks ${GITLEAKS_VERSION})"
            echo "- Alcance: historial completo, todas las ramas (\`--log-opts=--all\`)"
            echo "- Config: \`.gitleaks.toml\` (reglas por defecto + falsos positivos justificados)"
            echo "- Si falla: **rotar el secreto primero**, limpiar el historial después. Ver \`docs/security/secret-scanning.md\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Container scan (S10): construye la imagen en el runner (sin publicarla)
  # y Trivy busca CVEs del sistema operativo y de las librerías.
  # Así una imagen vulnerable se frena en el PR, antes de llegar a GHCR.
  # ---------------------------------------------------------------------------
  container-scan:
    name: container-scan (trivy image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Construir la imagen (solo local, no se publica)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: scoring-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy sobre la imagen (falla en HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scoring-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # SAST: análisis estático del código de la API (Semgrep)
  # Reglas públicas (OWASP, Python, Kubernetes) + reglas propias en .semgrep/
  # Reporta todo; bloquea el merge solo si hay hallazgos de severidad ERROR.
  # Regla del taller: un falso positivo se corrige con un PR a la regla, no con nosec.
  # ---------------------------------------------------------------------------
  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # TODO: fijar la versión exacta de semgrep tras la primera corrida verde
      # (igual que gitleaks arriba), p. ej. "semgrep==X.Y.Z".
      - name: Instalar semgrep
        run: |
          set -euo pipefail
          pip install "semgrep>=1.0,<2.0"
          semgrep --version

      # Tests de las reglas propias: cada `# ruleid:` debe disparar y cada `# ok:` no.
      # Los archivos van explícitos: con carpetas (`--config .semgrep/ tests/semgrep/`)
      # semgrep no empareja regla y test, dice "No unit tests found" y sale en verde sin probar nada.
      - name: Tests de las reglas propias
        run: semgrep --test --config .semgrep/rules.yml tests/semgrep/rules.py

      # Sin --error: aquí solo se genera el reporte completo (ERROR y WARNING).
      - name: Escaneo SAST
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/python \
            --config p/kubernetes \
            --config .semgrep/ \
            --metrics off \
            --sarif-output semgrep.sarif

      - name: Subir reporte (SARIF)
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-report
          path: semgrep.sarif
          retention-days: 30

      # Gate bloqueante: falla solo con severidad ERROR. Los WARNING quedan en el resumen.
      - name: Gate (bloquear si hay hallazgos ERROR)
        run: |
          set -euo pipefail
          ERRORS=$(jq '[.runs[].results[] | select(.level=="error")] | length' semgrep.sarif)
          WARNINGS=$(jq '[.runs[].results[] | select(.level=="warning")] | length' semgrep.sarif)
          {
            echo "### SAST (semgrep)"
            echo "- Hallazgos ERROR (bloquean): **${ERRORS}**"
            echo "- Hallazgos WARNING (revisar): **${WARNINGS}**"
            echo "- Reglas: OWASP Top 10, Python, Kubernetes y \`.semgrep/\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Semgrep encontró ${ERRORS} hallazgo(s) ERROR. Corrige el código o la regla (PR), sin nosec."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Contrato OpenAPI: lint de seguridad con reglas OWASP API Top 10 (Spectral)
  # ---------------------------------------------------------------------------
  contract:
    name: contract (openapi + owasp)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # TODO: fijar versiones exactas de spectral tras la primera corrida verde.
      - name: Spectral lint
        run: |
          set -euo pipefail
          OPENAPI=$(find . -name 'openapi.yaml' -not -path './node_modules/*' | head -1)
          test -n "$OPENAPI" || { echo "::error::No se encontró openapi.yaml"; exit 1; }
          npm install --no-save @stoplight/spectral-cli @stoplight/spectral-owasp-ruleset
          npx spectral lint "$OPENAPI" --ruleset .spectral.yaml --fail-severity=error
