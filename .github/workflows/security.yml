name: security

# S09 · DevSecOps I. Este archivo reúne los jobs de seguridad del equipo.
# Jobs: `sca` (Trivy + SBOM) y `secrets` (secret scanning con historial completo).
# El job `sast` se agrega debajo, en paralelo.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # lunes 09:00 UTC: re-escaneo semanal (reglas nuevas de gitleaks)
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.28.0"
  PYTHON_VERSION: "3.11" # misma versión que ci.yml y el Dockerfile
  CYCLONEDX_BOM_VERSION: "8.0.1"

jobs:
  sca:
    name: sca (Trivy + SBOM CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # El SBOM se genera desde el entorno ya instalado, no desde requirements.txt:
      # requirements.txt fija 3 dependencias directas, pero al instalarlas llegan ~15
      # (pydantic, anyio, h11...). Un CVE en una transitiva solo se ve en este SBOM.
      - name: Generar SBOM CycloneDX (directas + transitivas)
        run: |
          set -euo pipefail
          python -m venv /tmp/app
          /tmp/app/bin/pip install -q -r requirements.txt
          pip install -q "cyclonedx-bom==${CYCLONEDX_BOM_VERSION}"
          # cyclonedx-py valida el JSON contra el esquema CycloneDX y falla si no es válido.
          cyclonedx-py environment /tmp/app/bin/python --of JSON -o sbom.json

      - name: Subir SBOM como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90 # máximo de GitHub

      # Gate 1: dependencias declaradas en el repo (requirements.txt y otros manifiestos).
      # Falla en HIGH/CRITICAL solo si ya existe versión con parche (ignore-unfixed).
      - name: Trivy filesystem (dependencias declaradas)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Gate 2: el SBOM completo, para cubrir las transitivas que requirements.txt no lista.
      - name: Trivy sobre el SBOM (incluye transitivas)
        if: always() && hashFiles('sbom.json') != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: sbom.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Resumen
        if: always() && hashFiles('sbom.json') != ''
        run: |
          {
            echo "### SCA (Trivy) + SBOM"
            echo "- SBOM CycloneDX: $(jq '.components | length' sbom.json) componentes (artefacto \`sbom-cyclonedx\`)"
            echo "- Gate: falla en HIGH/CRITICAL con parche disponible (\`ignore-unfixed\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: secrets (gitleaks, historial completo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 trae TODOS los commits y ramas. Sin esto el clon es
      # superficial (1 commit) y un secreto borrado después no se detectaría.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (versión fijada + checksum)
        run: |
          set -euo pipefail
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          TAR="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$TAR" "${BASE}/${TAR}"
          curl -sSfL -o checksums.txt "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c checksums.txt
          tar -xzf "$TAR" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Escanea el historial de todas las ramas (no solo el rango del PR).
      # Falla (exit 1) si hay hallazgos no justificados en .gitleaks.toml.
      - name: Escaneo del historial completo
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            --verbose

      - name: Subir reporte (SARIF)
        if: always() && hashFiles('gitleaks-report.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 30

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Secret scanning (gitleaks ${GITLEAKS_VERSION})"
            echo "- Alcance: historial completo, todas las ramas (\`--log-opts=--all\`)"
            echo "- Config: \`.gitleaks.toml\` (reglas por defecto + falsos positivos justificados)"
            echo "- Si falla: **rotar el secreto primero**, limpiar el historial después. Ver \`docs/security/secret-scanning.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
