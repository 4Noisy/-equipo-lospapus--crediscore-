name: ci-crediscore

on:
  pull_request: {}
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/4noisy/scoring-api
  GITOPS_REPO: 4Noisy/lospapus-gitops

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (gate)
        run: ruff check .
      - name: Tests + cobertura minima 70% (gate)
        run: pytest --cov=src --cov-fail-under=70
      - name: SAST con Semgrep (gate)
        run: |
          pip install semgrep
          semgrep scan --config p/python --error --metrics=off src

  build-and-push:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  promote-to-gitops:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo gitops
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Actualizar tag y abrir PR
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          BRANCH="release-${GITHUB_SHA::7}"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          cd overlays/dev
          kustomize edit set image ${{ env.IMAGE }}=${{ env.IMAGE }}:${GITHUB_SHA}
          cd ../..
          git commit -am "release: scoring-api ${GITHUB_SHA::7}"
          git push origin "$BRANCH"
          gh pr create --repo ${{ env.GITOPS_REPO }} \
            --title "Release scoring-api ${GITHUB_SHA::7}" \
            --body "Promocion automatica desde CI (commit ${GITHUB_SHA})."
