# MVP CrediScore: `docker compose up --build` y abre http://localhost:8080
services:
  scoring-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      EXPLAINER_MODE: template   # sin costo ni credenciales; usa "llm" + ANTHROPIC_API_KEY para la IA real
      APP_PORT: "8080"
    healthcheck:
      # La imagen es distroless (sin shell/curl): se prueba con el propio Python.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
