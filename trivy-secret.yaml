# Configuración del escáner de SECRETOS de Trivy (job container-scan de security.yml).
# Trivy lee este archivo desde la raíz del repo; el escaneo de vulnerabilidades no cambia.
#
# Excepción (S18, PR #30), con su motivo como pide el README > triage y excepciones:
#   La regla gcp-service-account marca como CRITICAL el texto `{"type": "service_account"}`
#   que aparece en los docstrings del SDK oficial de Anthropic (anthropic/resources/beta/agents
#   y anthropic/types/beta/*). Es documentación de un parámetro, no una credencial: una llave
#   real de GCP trae private_key y client_email, que no están. Falso positivo.
#   El alcance es solo la carpeta del SDK dentro de la imagen; nuestro código (src/) sigue
#   escaneado por esta misma regla y por gitleaks sobre todo el historial.
#   Revisar al actualizar anthropic (requirements.txt).
allow-rules:
  - id: anthropic-sdk-docstrings
    description: Docstrings del SDK de Anthropic con el literal "service_account" (falso positivo)
    path: '^/?app/deps/anthropic/'
